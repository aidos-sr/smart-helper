name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        # Reproduce Vercel's provider environment without real credentials.
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: test-only-not-a-key
          GEMINI_MODEL: gemini-3.8-flash
      - run: npm audit --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=low
